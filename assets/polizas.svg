<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg-pol" cx="0.32" cy="0.22" r="1">
      <stop offset="0" stop-color="#FCEAB0"></stop>
      <stop offset="0.45" stop-color="#DDA85A"></stop>
      <stop offset="1" stop-color="#6E4914"></stop>
    </radialGradient>
    <linearGradient id="rim-pol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9B3" stop-opacity="0.85"></stop>
      <stop offset="0.5" stop-color="#9A6A1F" stop-opacity="0.5"></stop>
      <stop offset="1" stop-color="#FFE9B3" stop-opacity="0.7"></stop>
    </linearGradient>
    <linearGradient id="ink-pol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2308"></stop>
      <stop offset="0.5" stop-color="#1a0e02"></stop>
      <stop offset="1" stop-color="#0a0500"></stop>
    </linearGradient>

    <symbol id="pol-icon" viewBox="0 0 64 64">
      <g fill-rule="evenodd">
        <!-- Cuerpo del libro (cubierta) -->
        <path d="M 16 12 Q 14 12 14 15 V 49 Q 14 52 16 52 H 48 Q 50 52 50 49 V 15 Q 50 12 48 12 Z"></path>

        <!-- Detalles grabados en oro claro -->
        <g fill="#FCEAB0">
          <!-- Lomo (separación de la encuadernación) -->
          <rect x="19" y="15" width="1.7" height="34"></rect>
          <!-- Título en la cubierta -->
          <rect x="24" y="20" width="12" height="2"></rect>
          <rect x="24" y="25" width="9" height="2"></rect>
          <!-- Líneas de asiento (registro) -->
          <rect x="24" y="40" width="21" height="2"></rect>
          <rect x="24" y="44.5" width="16" height="2"></rect>
        </g>

        <!-- Marcapáginas (cinta) colgando del borde superior -->
        <path fill="#FCEAB0" d="M 40 12 H 45 V 28 L 42.5 25 L 40 28 Z"></path>
      </g>
    </symbol>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg-pol)"></rect>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4" fill="none" stroke="url(#rim-pol)" stroke-width="0.9"></rect>
  <rect x="2.4" y="2.4" width="59.2" height="59.2" rx="11.6" fill="none" stroke="#FFEED0" stroke-width="0.5" stroke-opacity="0.45"></rect>

  <g opacity="0.7" transform="translate(32 32) scale(0.82) translate(-32 -32)"><use href="#pol-icon" width="64" height="64" fill="#FFEFC0" transform="translate(0.5,0.9)"></use></g>
  <g transform="translate(32 32) scale(0.82) translate(-32 -32)"><use href="#pol-icon" width="64" height="64" fill="url(#ink-pol)"></use></g>
</svg>
